services:
  - type: web
    name: casestudy-ai-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: PROJECT_ID
        value: detleng-case-studies
      - key: DATASET_ID
        value: cs003_olist_analytics
      - key: LOCATION
        value: EU
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: CORS_ORIGINS
        value: https://casestudy.detleng.com,http://localhost:8001,http://127.0.0.1:8001
